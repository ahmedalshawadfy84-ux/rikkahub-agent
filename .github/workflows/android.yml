name: Android APK

# Debug APK on every push that touches the app — for the Iris fork: upload the modified
# files, then download the APK from this run's Artifacts section.
# The web module's gradle task shells out to bun + pnpm (web/build.gradle.kts), so both
# must be on PATH before Gradle runs.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: debug APK · arm64 + others
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (includes web-ui bundle via bun/pnpm)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Badging
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:|native-code" || true

      - uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-iris-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
